<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="166" viewBox="0 0 1120 166" role="img" aria-label="Nithish S animated developer profile graphic">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d1d"/><stop offset=".55" stop-color="#0f1730"/><stop offset="1" stop-color="#090d1c"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dfbd9"/><stop offset=".55" stop-color="#9caeff"/><stop offset="1" stop-color="#cd94ff"/></linearGradient>
<pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#9eb5de" stroke-opacity=".065"/></pattern>
<radialGradient id="halo"><stop stop-color="#6255bf" stop-opacity=".34"/><stop offset="1" stop-color="#6255bf" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.s{font-family:Inter,Segoe UI,Arial,sans-serif}
.m{font-family:Consolas,monospace;letter-spacing:1px}
.pulse{animation:pulse 2.7s ease-in-out infinite}
.rotate{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
.dash{animation:dash 12s linear infinite}
.float{animation:float 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-140}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="1118" height="164" rx="22" fill="url(#bg)" stroke="#354563"/><rect x="1" y="1" width="1118" height="164" rx="22" fill="url(#grid)"/><text x="42" y="42" class="m" fill="#87efda" font-size="15">END OF TRANSMISSION / NOT THE END OF THE BUILD</text><text x="42" y="105" class="s" font-size="42" font-weight="800" fill="#f5f8ff">Code. Learn. Build. Repeat.</text><path d="M42 132H1071" stroke="#76f5db" stroke-width="2" stroke-dasharray="10 16" class="dash"/><circle cx="1034" cy="73" r="32" stroke="#8eadd2" stroke-opacity=".5" fill="none"/><circle cx="1034" cy="73" r="18" stroke="#8cf5da" fill="none" class="pulse"/><circle cx="1034" cy="73" r="5" fill="#8cf5da" filter="url(#glow)"/></svg>