<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D1D"/><stop offset="0.55" stop-color="#0E1328"/><stop offset="1" stop-color="#090C19"/></linearGradient>
 <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#84FAD6"/><stop offset="0.48" stop-color="#9EBBFF"/><stop offset="1" stop-color="#CE97FF"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#70ECD7" stop-opacity="0"/><stop offset="0.5" stop-color="#70ECD7" stop-opacity="0.55"/><stop offset="1" stop-color="#70ECD7" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#7862C8" stop-opacity="0.24"/><stop offset="0.7" stop-color="#5344AB" stop-opacity="0.065"/><stop offset="1" stop-color="#5344AB" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#A8B6DE" stroke-opacity="0.055" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style><![CDATA[
 .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:1.6px}
 .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
 .pulse{animation:pulse 2.7s ease-in-out infinite;transform-origin:center}
 .twinkle{animation:twinkle 3.3s ease-in-out infinite}
 .dash{animation:dash 12s linear infinite}
 .float{animation:float 5s ease-in-out infinite}
 .flicker{animation:flicker 4.2s ease-in-out infinite}
 .scan{animation:scan 7s linear infinite}
 .travel{animation:travel 7s linear infinite}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @keyframes twinkle{0%,100%{opacity:.23}50%{opacity:.85}}
 @keyframes dash{to{stroke-dashoffset:-240}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes flicker{0%,96%,100%{opacity:1}97%{opacity:.3}99%{opacity:.65}}
 @keyframes scan{0%{transform:translateX(-600px);opacity:0}12%{opacity:.5}65%{opacity:.3}100%{transform:translateX(1600px);opacity:0}}
 @keyframes travel{0%{stroke-dashoffset:200;opacity:0}20%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
